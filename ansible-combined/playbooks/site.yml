---
# Main playbook to configure all data protection products
- name: Configure Data Protection Lab
  hosts: localhost
  gather_facts: yes
  vars:
    terraform_output: "{{ lookup('file', '../../terraform-combined/terraform.tfstate') | from_json }}"
    ddve_instance_id: "{{ terraform_output.outputs.ddve_instance_id.value }}"
    ddve_private_ip: "{{ terraform_output.outputs.ddve_private_ip.value }}"
    ddve_public_ip: "{{ lookup('env', 'DDVE_PUBLIC_IP') | default(terraform_output.outputs.ddve_public_ip.value, true) }}"
    avamar_private_ip: "{{ terraform_output.outputs.avamar_private_ip.value | default(omit) }}"
    ppdm_private_ip: "{{ terraform_output.outputs.powerprotect_private_ip.value | default(omit) }}"
    s3_bucket: "{{ terraform_output.outputs.s3_bucket_name.value }}"

  tasks:
    # Configure DDVE using the IP passed from Makefile
    - name: Configure DDVE
      include_role:
        name: ddve
      vars:
        ddve_host: "{{ ddve_public_ip }}"
        instance_id: "{{ ddve_instance_id }}"
        ddve_s3_bucket: "{{ s3_bucket }}"
      when: ddve_public_ip is defined and ddve_public_ip != ''

    # Display final access information
    - name: Display access information
      debug:
        msg:
          - "=== Data Protection Lab Configuration Complete ==="
          - ""
          - "DDVE Console (Configured): Access via Windows Jump Box"
          - "  Private IP: {{ ddve_private_ip }}"
          - "  Username: sysadmin"
          - "  Password: Changeme123!"
          - "  Status: Fully configured with S3 storage and DD Boost"
          - ""
          - "{% if avamar_private_ip is defined and avamar_private_ip != None %}Avamar (Manual Setup Required): {{ avamar_private_ip }}{% endif %}"
          - "{% if avamar_private_ip is defined and avamar_private_ip != None %}  Complete initial setup wizard via GUI{% endif %}"
          - "{% if avamar_private_ip is defined and avamar_private_ip != None %}  Add DDVE at: {{ ddve_private_ip }}{% endif %}"
          - ""
          - "{% if ppdm_private_ip is defined and ppdm_private_ip != None %}PowerProtect (Manual Setup Required): {{ ppdm_private_ip }}:14443{% endif %}"
          - "{% if ppdm_private_ip is defined and ppdm_private_ip != None %}  Complete initial setup wizard via GUI{% endif %}"
          - "{% if ppdm_private_ip is defined and ppdm_private_ip != None %}  Add DDVE at: {{ ddve_private_ip }}{% endif %}"
          - ""
          - "Note: Only DDVE is automatically configured. Avamar and PPDM require manual setup."