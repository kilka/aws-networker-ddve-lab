---
# Avamar Configuration Role
# Basic setup for Avamar integration with DDVE

- name: Wait for Avamar to be accessible
  wait_for:
    host: "{{ avamar_host }}"
    port: 443
    delay: 60
    timeout: 1200

- name: Display Avamar configuration info
  debug:
    msg:
      - "Avamar Configuration:"
      - "  Host: {{ avamar_host }}"
      - "  DDVE Host: {{ ddve_host_private }}"
      - "  Initial setup must be done via GUI"
      - "  Access URL: https://{{ avamar_host }}"
      - "  Administrator Console: https://{{ avamar_host }}:8443/avi"
      - ""
      - "Manual Configuration Steps:"
      - "1. Complete initial Avamar setup wizard"
      - "2. Add Data Domain system:"
      - "   - Host: ddve.dataprotection.lab"
      - "   - User: avamar"
      - "   - Password: Changeme123!"
      - "   - Storage Unit: Avamar_SU"